name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 782267171976.dkr.ecr.us-east-1.amazonaws.com

      - name: Build Docker image
        run: |
          docker build -t img1 .

      - name: Tag Docker image
        run: |
          docker tag img1:latest 782267171976.dkr.ecr.us-east-1.amazonaws.com/img1:latest

      - name: Push image to ECR
        run: |
          docker push \
          docker push 782267171976.dkr.ecr.us-east-1.amazonaws.com/img1:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 52.0.58.138
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            # Login to ECR
            aws ecr get-login-password \
              --region us-east-1 | \
              docker login \
              --username AWS \
              --password-stdin \
              543855655532.dkr.ecr.us-east-1.amazonaws.com

            # Pull latest image
            docker pull \
              543855655532.dkr.ecr.us-east-1.amazonaws.com/img1:latest

            # Stop existing container
            docker stop img1 || true

            # Remove existing container
            docker rm img1 || true

            # Run new container
            docker run -d \
              --name img1 \
              -p 5001:5000 \
              782267171976.dkr.ecr.us-east-1.amazonaws.com/img1:latest

            # Check container
            docker ps
